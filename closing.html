<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرابط مغلق | KIB</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* تأثير النبض الهادئ للأيقونة */
        .pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }
        @keyframes pulse-soft {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(122, 33, 40, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(122, 33, 40, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(122, 33, 40, 0); }
        }

        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#7A2128] selection:text-white">

    <header class="bg-[#7A2128] text-white p-3 md:p-4 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto max-w-5xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white p-1.5 rounded-full shadow-sm flex-shrink-0">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTxIhDB302tFWezCQwkWsaUd6V0v0dKMpBIA&s" alt="KIB" class="h-8 w-8 md:h-10 md:w-10 object-contain rounded-full">
                </div>
                <div class="overflow-hidden">
                    <h1 class="text-sm md:text-lg font-bold truncate">بوابة التقييمات والاستبيانات</h1>
                    <p class="text-[10px] md:text-xs text-red-100 truncate">بنك الكريمي الإسلامي</p>
                </div>
            </div>
            <div class="bg-white/10 rounded-full w-10 h-10 flex items-center justify-center border border-white/20 backdrop-blur-sm" title="النظام مغلق">
                <i class="fas fa-lock text-white text-lg opacity-90"></i>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        
        <div class="bg-white rounded-3xl card-shadow p-8 md:p-12 text-center border-t-8 border-[#7A2128] max-w-lg w-full relative overflow-hidden">
            
            <!-- خلفية زخرفية خفيفة داخل الكرت -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-red-50 rounded-bl-full opacity-50 -z-0"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-gray-50 rounded-tr-full opacity-80 -z-0"></div>

            <div class="relative z-10">
                <div class="flex justify-center mb-6">
                    <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center pulse-soft border border-red-100">
                        <i class="fas fa-lock text-5xl text-[#7A2128]"></i>
                    </div>
                </div>

                <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-4 tracking-wide">
                    عذراً، هذا الرابط مغلق حالياً
                </h2>
                
                <div class="bg-gray-50 rounded-xl p-5 mb-6 border border-gray-100">
                    <p class="text-base text-gray-600 font-semibold leading-relaxed">
                        نشكرك على اهتمامك ووقتك. لقد انتهت الفترة المخصصة لاستقبال الردود على هذا النموذج، أو تم إغلاقه من قبل الإدارة.
                    </p>
                </div>

                <div class="flex justify-center items-center gap-2 text-sm font-bold text-gray-500 bg-white border-2 border-gray-100 rounded-full py-2 px-6 inline-flex mx-auto">
                    <i class="fas fa-calendar-alt text-[#7A2128]"></i>
                    <span>تاريخ الإغلاق:</span>
                    <span id="closeDate" class="text-gray-700">جاري التحميل...</span>
                </div>
            </div>

        </div>

    </main>

    <footer class="text-center p-6 text-gray-400 text-sm font-semibold">
        <i class="fas fa-shield-alt ml-1"></i> جميع الحقوق محفوظة - بنك الكريمي الإسلامي
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // قم بتغيير التاريخ بين علامتي التنصيص إلى التاريخ الذي تريده
            const customDate = "الإثنين، 31 أغسطس 2026";
            
            // تعيين التاريخ في الصفحة
            document.getElementById('closeDate').textContent = customDate;
        });
    </script>

</body>
</html>
